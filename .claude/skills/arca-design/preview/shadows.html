<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .row { display: flex; gap: 24px; align-items: center; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .box { width: 160px; height: 100px; background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--border); }
  .sm { box-shadow: var(--shadow-sm); }
  .md { box-shadow: var(--shadow-md); }
  .name { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .val  { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
</style>
</head><body>
  <div class="row">
    <div class="item">
      <div class="box"></div>
      <span class="name">no shadow</span>
      <span class="val">border-only</span>
    </div>
    <div class="item">
      <div class="box sm"></div>
      <span class="name">shadow-sm</span>
      <span class="val">0 1px 2px rgba(18,19,26,.04)</span>
    </div>
    <div class="item">
      <div class="box md"></div>
      <span class="name">shadow-md · hover</span>
      <span class="val">0 1px 3px · 0 4px 12px @ .04</span>
    </div>
  </div>
</body></html>
