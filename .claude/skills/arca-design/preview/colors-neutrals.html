<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw {
    width: 140px; border: 1px solid var(--border); border-radius: var(--r-md);
    overflow: hidden; background: var(--surface);
  }
  .sw .chip { height: 68px; border-bottom: 1px solid var(--border); }
  .sw .meta { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sw .name { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .sw .hex  { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
</style>
</head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F7F6F2"></div><div class="meta"><span class="name">bg</span><span class="hex">#F7F6F2</span></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><span class="name">surface</span><span class="hex">#FFFFFF</span></div></div>
    <div class="sw"><div class="chip" style="background:#FBFAF6"></div><div class="meta"><span class="name">surface-2</span><span class="hex">#FBFAF6</span></div></div>
    <div class="sw"><div class="chip" style="background:#ECEAE3"></div><div class="meta"><span class="name">border</span><span class="hex">#ECEAE3</span></div></div>
    <div class="sw"><div class="chip" style="background:#DFDCD3"></div><div class="meta"><span class="name">border-strong</span><span class="hex">#DFDCD3</span></div></div>
  </div>
</body></html>
