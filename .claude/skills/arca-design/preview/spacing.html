<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .scale { display: flex; gap: 12px; align-items: flex-end; }
  .tick { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar  { background: var(--navy-700); border-radius: 2px; width: 22px; }
  .n    { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
  .sub  { margin-top: 18px; font-size: 12px; color: var(--ink-3); }
</style>
</head><body>
  <div class="scale">
    <div class="tick"><div class="bar" style="height:2px"></div><span class="n">2</span></div>
    <div class="tick"><div class="bar" style="height:4px"></div><span class="n">4</span></div>
    <div class="tick"><div class="bar" style="height:6px"></div><span class="n">6</span></div>
    <div class="tick"><div class="bar" style="height:8px"></div><span class="n">8</span></div>
    <div class="tick"><div class="bar" style="height:10px"></div><span class="n">10</span></div>
    <div class="tick"><div class="bar" style="height:12px"></div><span class="n">12</span></div>
    <div class="tick"><div class="bar" style="height:14px"></div><span class="n">14</span></div>
    <div class="tick"><div class="bar" style="height:16px"></div><span class="n">16</span></div>
    <div class="tick"><div class="bar" style="height:18px"></div><span class="n">18</span></div>
    <div class="tick"><div class="bar" style="height:20px"></div><span class="n">20</span></div>
    <div class="tick"><div class="bar" style="height:24px"></div><span class="n">24</span></div>
    <div class="tick"><div class="bar" style="height:28px"></div><span class="n">28</span></div>
    <div class="tick"><div class="bar" style="height:32px"></div><span class="n">32</span></div>
    <div class="tick"><div class="bar" style="height:36px"></div><span class="n">36</span></div>
    <div class="tick"><div class="bar" style="height:60px"></div><span class="n">60</span></div>
  </div>
  <div class="sub">Card gap 14 · Page padding 28/36/60 · Card padding 16/20/14</div>
</body></html>
