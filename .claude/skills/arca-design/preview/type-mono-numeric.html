<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 12px 20px; align-items: baseline; }
  .lbl { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
  .mono { font-family: var(--ff-mono); font-size: 11.5px; color: var(--ink-3); }
  .kbd { font-family: var(--ff-mono); font-size: 10.5px; background: #0B1730; color: #B3B7C2; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; }
  .dd { font-family: var(--ff-display); font-size: 16px; font-weight: 700; line-height: 1; letter-spacing:-0.02em; color: var(--ink); }
  .dm { font-family: var(--ff-display); font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .delta { font-family: var(--ff-sans); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-pos-fg); background: var(--accent-pos-bg); padding: 2px 7px; border-radius: 20px; }
</style>
</head><body>
  <div class="row">
    <span class="lbl">mono / CUIT</span><span class="mono">CUIT 30-71045821-6</span>
    <span class="lbl">mono / inv id</span><span class="mono">FC A 0004-00012847</span>
    <span class="lbl">kbd</span><span><kbd class="kbd">⌘K</kbd></span>
    <span class="lbl">date / 16·700</span><span><span class="dd">22</span>&nbsp;&nbsp;<span class="dm">abr</span></span>
    <span class="lbl">delta / 11.5·600</span><span><span class="delta">+92.3%</span></span>
  </div>
</body></html>
