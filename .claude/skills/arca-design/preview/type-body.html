<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 12px 20px; align-items: baseline; }
  .lbl { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
  .nav   { font-family: var(--ff-sans); font-size: 13px; font-weight: 500; color: var(--ink); }
  .body  { font-family: var(--ff-sans); font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .sub   { font-family: var(--ff-sans); font-size: 12px; color: var(--ink-3); }
  .micro { font-family: var(--ff-sans); font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .tag   { font-family: var(--ff-sans); font-size: 11px; font-weight: 500; color: var(--ink-2); }
</style>
</head><body>
  <div class="row">
    <span class="lbl">nav / 13·500</span><span class="nav">Clientes</span>
    <span class="lbl">body / 13·400</span><span class="body">Resumen general de tus clientes y actividad contable.</span>
    <span class="lbl">sub / 12·400</span><span class="sub">Ventas vs Compras · últimos 6 meses</span>
    <span class="lbl">micro / 10.5·600</span><span class="micro">Plataforma</span>
    <span class="lbl">tag / 11·500</span><span class="tag">Al día</span>
  </div>
</body></html>
