<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw {
    width: 140px; border: 1px solid var(--border); border-radius: var(--r-md);
    overflow: hidden; background: var(--surface);
  }
  .sw .chip { height: 68px; border-bottom: 1px solid var(--border); display:flex; align-items:flex-end; padding: 8px; color: #fff;
    font-family: var(--ff-display); font-weight: 600; font-size: 13px;
  }
  .sw .meta { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sw .name { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .sw .hex  { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
</style>
</head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#12131A">Aa</div><div class="meta"><span class="name">ink</span><span class="hex">#12131A</span></div></div>
    <div class="sw"><div class="chip" style="background:#3E404A">Aa</div><div class="meta"><span class="name">ink-2</span><span class="hex">#3E404A</span></div></div>
    <div class="sw"><div class="chip" style="background:#6E7079">Aa</div><div class="meta"><span class="name">ink-3</span><span class="hex">#6E7079</span></div></div>
    <div class="sw"><div class="chip" style="background:#9B9CA3">Aa</div><div class="meta"><span class="name">ink-4</span><span class="hex">#9B9CA3</span></div></div>
  </div>
</body></html>
