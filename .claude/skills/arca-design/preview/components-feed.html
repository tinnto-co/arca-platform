<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 6px 0; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 12px 20px; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .ico { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; color: var(--ink-2); }
  .ico.pos { background: var(--accent-pos-bg); color: var(--accent-pos-fg); border-color: transparent; }
  .ico.info { background: var(--accent-info-bg); color: var(--accent-info-fg); border-color: transparent; }
  .ico.warn { background: var(--accent-warn-bg); color: var(--accent-warn-fg); border-color: transparent; }
  .t { font-size: 13px; color: var(--ink); font-weight: 500; line-height: 1.35; }
  .t b { font-weight: 600; }
  .s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .mono { font-family: var(--ff-mono); }
  .time { font-size: 11px; color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head><body>
  <div class="card">
    <div class="item">
      <div class="ico pos"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div><div class="t"><b>Maderera Austral</b> confirmó el pago de 3 facturas</div><div class="s"><span class="mono">FC A 0004-00012847</span> · $ 4.827.950</div></div>
      <div class="time">hace 12 min</div>
    </div>
    <div class="item">
      <div class="ico warn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      <div><div class="t"><b>Logística del Valle</b> supera los 8 días de mora</div><div class="s">Deuda acumulada: $ 8.848 · recordatorio enviado</div></div>
      <div class="time">hace 3 h</div>
    </div>
  </div>
</body></html>
