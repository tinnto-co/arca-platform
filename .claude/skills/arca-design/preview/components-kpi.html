<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .kpi { width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; display:flex; flex-direction:column; gap: 14px; position: relative; overflow: hidden; }
  .head { display:flex; align-items:center; justify-content:space-between; }
  .lab { font-size: 12.5px; font-weight: 500; color: var(--ink-3); display:flex; align-items:center; gap:7px; }
  .ico { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; color: var(--ink-2); }
  .delta { display:inline-flex; align-items:center; gap: 3px; padding: 2px 7px; border-radius: 20px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-pos-fg); background: var(--accent-pos-bg); }
  .v { font-family: var(--ff-display); font-size: 28px; font-weight:600; letter-spacing:-0.025em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .v .cur { color: var(--ink-3); font-weight:500; font-size: 18px; margin-right: 4px; }
  .foot { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; display:flex; justify-content:space-between; }
  .foot .muted { color: var(--ink-4); }
  .spark { position:absolute; right: 16px; bottom: 14px; height: 34px; width: 90px; opacity: .9; }
</style>
</head><body>
  <div class="kpi">
    <div class="head">
      <span class="lab">
        <span class="ico">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </span>Compras del mes
      </span>
      <span class="delta">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        92.3%
      </span>
    </div>
    <div class="v"><span class="cur">$</span>190.746.909</div>
    <div class="foot"><span class="muted">vs mes anterior</span><span>$ 2.474.707.731</span></div>
    <svg class="spark" viewBox="0 0 90 34" preserveAspectRatio="none">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="oklch(0.62 0.13 160)" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="oklch(0.62 0.13 160)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="M0 26 L10 24 L20 22 L30 18 L40 20 L50 14 L60 15 L70 9 L80 7 L90 4 L90 34 L0 34 Z" fill="url(#g)"/>
      <path d="M0 26 L10 24 L20 22 L30 18 L40 20 L50 14 L60 15 L70 9 L80 7 L90 4" fill="none" stroke="oklch(0.62 0.13 160)" stroke-width="1.5"/>
    </svg>
  </div>
</body></html>
