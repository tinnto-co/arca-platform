<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .logo { width: 80px; height: 80px; border-radius: 16px; background: linear-gradient(135deg, #F7F6F2, #E8E4D6); color: var(--navy-900); display:flex; align-items:center; justify-content:center; font-family: var(--ff-display); font-weight: 700; font-size: 30px; letter-spacing: -0.04em; box-shadow: var(--shadow-sm); }
  .user { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #2A4680, #C2A878); display:flex; align-items:center; justify-content:center; font-family: var(--ff-display); font-weight: 700; font-size: 20px; color: #F7F6F2; }
  .lbl { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); width: 100%; }
  .meta { display:flex; flex-direction:column; gap:2px; }
  .name { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .val { font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3); }
</style>
</head><body>
  <span class="lbl">brand — generated monograms, no bitmap logo exists</span>
  <div class="row">
    <div class="logo">BG</div>
    <div class="meta"><span class="name">Workspace avatar</span><span class="val">linear-gradient(135°, #F7F6F2 → #E8E4D6)</span><span class="val">navy-900 text · Inter Tight 700</span></div>
    <div class="user">ES</div>
    <div class="meta"><span class="name">User avatar</span><span class="val">linear-gradient(135°, #2A4680 → #C2A878)</span><span class="val">cream text · Inter Tight 700</span></div>
  </div>
</body></html>
