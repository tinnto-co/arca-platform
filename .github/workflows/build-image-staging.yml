name: Build image (staging)

# Buildea la imagen en el runner de GitHub (amd64, 16 GB) y la publica en GHCR.
# El servidor NO compila: `vite build` pide ~5 GB de RSS y el OOM killer lo mata
# (deploy fallido del 14/08 10:49). Coolify usa el build pack "Docker Image" y
# solo hace pull. Esto NO deploya: el deploy se aprieta a mano en Coolify.
#
# VITE_BETTER_AUTH_URL se hornea en el bundle del cliente (Dockerfile:13), así
# que hay una imagen por entorno: mismo commit, distinto tag.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: build-image-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: staging
            auth_url: https://contable.staging.tinnto.ai/api/auth
          - tag: contable
            auth_url: https://contable.tinnto.ai/api/auth
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_BETTER_AUTH_URL=${{ matrix.auth_url }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Resumen
        run: |
          echo "### Imagen publicada (${{ matrix.tag }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ matrix.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ matrix.tag }}-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy: Coolify → la app del entorno → Deploy" >> $GITHUB_STEP_SUMMARY
