name: Build image

# El servidor de Coolify tiene 7,6 GB repartidos entre nueve proyectos y el
# bundling de este proyecto necesita ~3,5 GB de pico. Cuando el margen no
# alcanza, el kernel mata el build con SIGKILL (exit 137). No es reducible por
# configuración: se probó externalizar CopilotKit del SSR, podar dependencias,
# code-splitting, bajar maxParallelFileOps de Rollup y el GC de Bun (--smol).
#
# Acá el runner tiene 16 GB. Construimos la imagen y la publicamos en GHCR;
# Coolify pasa a hacer `pull` de una imagen ya hecha en vez de compilarla.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BETTER_AUTH_URL=${{ vars.VITE_BETTER_AUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
