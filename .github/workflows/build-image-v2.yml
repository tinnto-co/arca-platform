name: Build image (v2 / staging)

# Buildea la imagen en el runner de GitHub (amd64, 16 GB) y la publica en GHCR.
# El servidor de staging NO compila: Coolify usa el build pack "Docker Image" y
# solo hace pull. Esto NO deploya: el deploy se aprieta a mano en Coolify.
on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: build-image-v2
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Se hornea en el bundle del cliente (Dockerfile:13) → una imagen por entorno.
  VITE_BETTER_AUTH_URL: https://v2-contable.staging.tinnto.ai/api/auth

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_BETTER_AUTH_URL=${{ env.VITE_BETTER_AUTH_URL }}
          tags: |
            ${{ env.IMAGE }}:v2
            ${{ env.IMAGE }}:v2-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:v2" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:v2-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy: Coolify → V2: Arca Platform → Deploy" >> $GITHUB_STEP_SUMMARY
